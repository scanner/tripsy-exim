[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tripsy-exim"
dynamic = ["version"]
description = "Export and import trip data for Tripsy.app"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [
  { name="Scanner Luce", email="scanner@apricot.com" },
]
maintainers = [
  { name="Scanner Luce", email="scanner@apricot.com" },
]
keywords = ["tripsy", "tripit", "travel", "ics", "icalendar", "export"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
dependencies = [
    "click",
    "httpx",
    "icalendar",
    "pydantic",
    "python-dotenv",
    "rich",
]

[project.scripts]
tripsy-exim = "tripsy_exim.cli:main"

[project.urls]
Homepage = "https://github.com/scanner/tripsy-exim"
Issues = "https://github.com/scanner/tripsy-exim/issues"
Changelog = "https://github.com/scanner/tripsy-exim/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    # Testing
    "factory-boy",
    "faker",
    "pytest",
    "pytest-check",
    "pytest-cov",
    "pytest-factoryboy",
    "pytest-mock",
    "respx",
    # Linting and formatting
    "mypy",
    "pre-commit",
    "ruff",
    # Build
    "build",
    "hatch",
]

[tool.hatch.version]
path = "tripsy_exim/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
   "tripsy_exim",
   "LICENSE",
   "README.md",
   "CHANGELOG.md",
]
exclude = [
   "tests",
   ".venv",
   ".gitignore",
]

[tool.ruff]
target-version = "py314"
line-length = 80

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "I",   # isort
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
exclude = [
    '__pycache__',
    '.*[-_]cache',
    '\.venv',
    'fixtures',
]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: talks to the real Tripsy API (deselect with '-m \"not live\"')",
]

[tool.coverage.run]
source = ["tripsy_exim"]
