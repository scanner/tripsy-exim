# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=1200"]
      - id: check-yaml
        # Drone pipelines are multi-document YAML.
        args: ["--allow-multiple-documents"]
      - id: check-toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic
          - click
  - repo: local
    hooks:
      # Only synthetic fixtures are committed, and .gitignore re-allows
      # this directory for them, so what lands here is checked at the
      # one moment it can still be stopped.
      - id: fixtures-are-not-a-real-export
        name: no committed fixture claims to come from TripIt
        language: pygrep
        entry: (?i)tripit\.com
        files: ^tests/fixtures/.*\.(ics|json)$
      - id: calendars-carry-the-synthetic-prodid
        name: every committed .ics fixture is the generator's
        language: pygrep
        entry: //tripsy-exim//synthetic test calendar//
        args: [--negate]
        files: ^tests/fixtures/.*\.ics$
      - id: exports-carry-the-synthetic-marker
        name: every committed .json fixture is the generator's
        language: pygrep
        entry: x_synthetic.*tripsy-exim generated export
        args: [--negate]
        files: ^tests/fixtures/.*\.json$
